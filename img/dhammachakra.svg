<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="dcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD"/>
      <stop offset="50%" stop-color="#DFAC57"/>
      <stop offset="100%" stop-color="#9A6B1F"/>
    </linearGradient>
  </defs>
  <!-- Outer Rim -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#dcGold)" stroke-width="6"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#dcGold)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="26" fill="#0C254B" stroke="url(#dcGold)" stroke-width="4"/>
  <circle cx="100" cy="100" r="10" fill="url(#dcGold)"/>

  <!-- 24 Spokes -->
  <g stroke="url(#dcGold)" stroke-width="3" stroke-linecap="round">
    <!-- 24 spokes rotated by 15 deg each -->
    <line x1="100" y1="20" x2="100" y2="74"/>
    <line x1="100" y1="180" x2="100" y2="126"/>
    <line x1="20" y1="100" x2="74" y2="100"/>
    <line x1="180" y1="100" x2="126" y2="100"/>

    <line x1="100" y1="20" x2="100" y2="74" transform="rotate(15 100 100)"/>
    <line x1="100" y1="180" x2="100" y2="126" transform="rotate(15 100 100)"/>
    <line x1="20" y1="100" x2="74" y2="100" transform="rotate(15 100 100)"/>
    <line x1="180" y1="100" x2="126" y2="100" transform="rotate(15 100 100)"/>

    <line x1="100" y1="20" x2="100" y2="74" transform="rotate(30 100 100)"/>
    <line x1="100" y1="180" x2="100" y2="126" transform="rotate(30 100 100)"/>
    <line x1="20" y1="100" x2="74" y2="100" transform="rotate(30 100 100)"/>
    <line x1="180" y1="100" x2="126" y2="100" transform="rotate(30 100 100)"/>

    <line x1="100" y1="20" x2="100" y2="74" transform="rotate(45 100 100)"/>
    <line x1="100" y1="180" x2="100" y2="126" transform="rotate(45 100 100)"/>
    <line x1="20" y1="100" x2="74" y2="100" transform="rotate(45 100 100)"/>
    <line x1="180" y1="100" x2="126" y2="100" transform="rotate(45 100 100)"/>

    <line x1="100" y1="20" x2="100" y2="74" transform="rotate(60 100 100)"/>
    <line x1="100" y1="180" x2="100" y2="126" transform="rotate(60 100 100)"/>
    <line x1="20" y1="100" x2="74" y2="100" transform="rotate(60 100 100)"/>
    <line x1="180" y1="100" x2="126" y2="100" transform="rotate(60 100 100)"/>

    <line x1="100" y1="20" x2="100" y2="74" transform="rotate(75 100 100)"/>
    <line x1="100" y1="180" x2="100" y2="126" transform="rotate(75 100 100)"/>
    <line x1="20" y1="100" x2="74" y2="100" transform="rotate(75 100 100)"/>
    <line x1="180" y1="100" x2="126" y2="100" transform="rotate(75 100 100)"/>
  </g>
</svg>
