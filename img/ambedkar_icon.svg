      <stop offset="0%" stop-color="#FCE0AD"/>
      <stop offset="50%" stop-color="#DFAC57"/>
      <stop offset="100%" stop-color="#9A6B1F"/>
    </linearGradient>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEDB3" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#DFAC57" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#DFAC57" stop-opacity="0"/>
